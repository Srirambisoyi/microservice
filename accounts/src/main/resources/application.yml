server:
  port: 8080
spring:
  application:
    name: "accounts"
  datasource:
    url: jdbc:h2:mem:eventdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: optional:configserver:http://configserver:8071/
    retry:
      initial-interval: 1000
      max-interval: 2000
      max-attempts: 6
      multiplier: 1.1

management:
  endpoints:
    web:
      exposure:
        include: "*"
rabbitmq:
  host: "rabbit"
  port: 5672
  username: "guest"
  password: "guest"