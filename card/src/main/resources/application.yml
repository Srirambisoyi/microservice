server:
  port: 9000
spring:
  application:
    name: "card"
  profiles:
    active: "prod"
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import: optional:configserver:http://configserver:8071/
    retry:
      initial-interval: 1000
      max-interval: 2000
      max-attempts: 6
      multiplier: 1.1

management:
  endpoints:
    web:
      exposure:
        include: "*"
rabbitmq:
  host: "rabbit"
  port: 5672
  username: "guest"
  password: "guest"